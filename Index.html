<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FoodFinder — Discover restaurants nearby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0E9C99;
    --teal-dark:#0B7F7C;
    --ink:#1A1D1F;
    --gray-text:#6B7280;
    --bg:#FFFFFF;
    --card:#F4F5F7;
    --border:#E7E9EC;
    --yellow:#FFC107;
    --marker:#FF5A3C;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); font-family:var(--font); color:var(--ink); overflow:hidden; }
  button{ font-family:var(--font); cursor:pointer; }
  input{ font-family:var(--font); }
  img,svg{ display:block; }
  a{ color:inherit; text-decoration:none; }

  #app{ position:relative; height:100%; width:100%; overflow:hidden; }
  .view{ position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg); }
  .view.active{ display:flex; }

  /* ---------- TOASTS ---------- */
  .toast{
    position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px;
    font-size:0.82rem; font-weight:600; opacity:0; pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease; z-index:200; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= DISCOVERY VIEW ================= */
  .search-bar-row{
    display:flex; align-items:center; gap:10px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px;
    background:#fff; z-index:20; box-shadow:0 2px 8px rgba(20,20,30,0.04);
  }
  .search-box{
    flex:1; display:flex; align-items:center; gap:10px;
    background:var(--card); border-radius:999px; padding:12px 16px;
  }
  .search-box svg{ flex-shrink:0; color:var(--gray-text); }
  .search-box input{
    border:none; background:none; outline:none; width:100%;
    font-size:1rem; font-weight:600; color:var(--ink);
  }
  .search-box input::placeholder{ color:var(--gray-text); font-weight:600; }
  .cart-btn{
    position:relative; width:44px; height:44px; border-radius:50%;
    background:var(--teal); border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cart-badge{
    position:absolute; top:-4px; right:-4px; background:var(--marker); color:#fff;
    font-size:0.62rem; font-weight:800; border-radius:999px; min-width:18px; height:18px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .discovery-body{ flex:1; display:flex; flex-direction:column; overflow:hidden; }

  .map-wrap{ position:relative; height:42vh; min-height:220px; flex-shrink:0; background:#DCE6E6; overflow:hidden; }
  .map-wrap svg{ width:100%; height:100%; }

  .search-area-btn{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:#fff; border:none; border-radius:999px; padding:9px 18px;
    font-size:0.78rem; font-weight:700; color:var(--ink);
    box-shadow:0 3px 10px rgba(20,20,30,0.18); display:flex; align-items:center; gap:6px;
  }

  .map-controls{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:8px; z-index:5;
  }
  .map-ctrl-btn{
    width:38px; height:38px; border-radius:10px; background:#fff; border:none;
    box-shadow:0 2px 8px rgba(20,20,30,0.18); font-size:1.1rem; font-weight:700; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }

  .marker{
    position:absolute; transform:translate(-50%,-100%); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; z-index:3; transition: transform 0.15s ease;
  }
  .marker .pin{
    background:var(--marker); color:#fff; font-weight:800; font-size:0.72rem;
    padding:5px 9px; border-radius:14px 14px 14px 3px; box-shadow:0 3px 8px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:3px; white-space:nowrap;
  }
  .marker .pin.no-rating{ background:var(--ink); }
  .marker.active{ transform:translate(-50%,-108%) scale(1.15); z-index:6; }
  .marker.hidden{ display:none; }

  .list-wrap{ flex:1; overflow-y:auto; padding: 14px 16px 100px; -webkit-overflow-scrolling:touch; }
  .list-heading{ font-size:0.95rem; font-weight:800; margin-bottom:12px; color:var(--gray-text); }

  .r-card{
    display:flex; gap:12px; padding:12px; border-radius:var(--radius-md);
    background:var(--card); margin-bottom:10px; align-items:center;
  }
  .r-card .thumb{
    width:64px; height:64px; border-radius:var(--radius-sm); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.7rem; color:#fff;
  }
  .r-card .info{ flex:1; min-width:0; }
  .r-card .name{ font-weight:800; font-size:0.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .r-card .meta{ display:flex; align-items:center; gap:6px; margin-top:4px; font-size:0.82rem; color:var(--gray-text); font-weight:600; }
  .r-card .stars{ color:var(--yellow); font-weight:800; }
  .r-card .status-dot{ width:6px; height:6px; border-radius:50%; }
  .r-card .status-dot.open{ background:#22C55E; }
  .r-card .status-dot.closed{ background:#EF4444; }
  .r-card .addr{ margin-top:3px; font-size:0.78rem; color:var(--gray-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .no-results{ text-align:center; padding:60px 20px; color:var(--gray-text); }
  .no-results .emoji{ font-size:2.4rem; margin-bottom:12px; }
  .no-results .t{ font-weight:800; color:var(--ink); margin-bottom:6px; }

  /* ---------- Bottom preview sheet ---------- */
  .preview-sheet{
    position:fixed; left:12px; right:12px; bottom:16px;
    background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(20,20,30,0.25);
    padding:16px; transform:translateY(140%); transition:transform 0.28s ease; z-index:50;
  }
  .preview-sheet.show{ transform:translateY(0); }
  .preview-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .preview-top .name{ font-weight:800; font-size:1.05rem; }
  .preview-close{ background:var(--card); border:none; width:26px; height:26px; border-radius:50%; font-size:0.9rem; flex-shrink:0; }
  .preview-meta{ margin-top:4px; font-size:0.85rem; color:var(--gray-text); font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .preview-actions{ display:flex; gap:10px; margin-top:14px; }
  .pa-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:var(--card); border:none; border-radius:12px; padding:10px 0;
    font-size:0.7rem; font-weight:700; color:var(--ink);
  }
  .pa-btn .ic{ font-size:1.15rem; }
  .pa-btn.primary{ background:var(--teal); color:#fff; }
  .view-details-hint{ margin-top:12px; text-align:center; font-size:0.78rem; font-weight:700; color:var(--teal); }

  /* ================= DETAILS VIEW ================= */
  .details-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:110px; }

  .details-topbar{
    position:sticky; top:0; z-index:15; display:flex; align-items:center; gap:12px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px; background:rgba(255,255,255,0.95);
    backdrop-filter:blur(6px);
  }
  .icon-btn{ width:38px; height:38px; border-radius:50%; background:var(--card); border:none; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
  .details-topbar .rname{ font-weight:800; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .details-topbar .spacer{ flex:1; }
  .save-btn.saved{ color:var(--marker); }

  .gallery{ padding: 0 16px; display:grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; gap:6px; height:230px; }
  .gallery .g-main{ grid-row: 1 / 3; border-radius: var(--radius-lg) 6px 6px var(--radius-lg); }
  .gallery .g-item:nth-child(2){ border-radius: 6px var(--radius-lg) 6px 6px; }
  .gallery .g-item:nth-child(3){ border-radius: 6px 6px var(--radius-lg) 6px; }
  .gallery .g-item{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    font-size:2.6rem; color:rgba(255,255,255,0.92);
  }
  .gallery .g-item .cap{
    position:absolute; left:10px; right:10px; bottom:8px; font-size:0.68rem; font-weight:700; color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .gallery .g-main .cap{ font-size:0.8rem; left:14px; right:14px; bottom:12px; }

  .details-head{ padding: 18px 16px 4px; }
  .details-head h1{ font-size:1.4rem; font-weight:800; }
  .rating-row{ display:flex; align-items:center; gap:8px; margin-top:8px; font-weight:700; font-size:0.95rem; }
  .rating-row .stars{ color:var(--yellow); }
  .rating-row .rc{ color:var(--gray-text); font-weight:600; }
  .cat-status-row{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:0.9rem; color:var(--gray-text); font-weight:600; flex-wrap:wrap; }
  .cat-status-row .status.open{ color:#16A34A; }
  .cat-status-row .status.closed{ color:#DC2626; }
  .cat-status-row .dot{ opacity:0.5; }
  .addr-line{ margin-top:8px; font-size:0.9rem; color:var(--gray-text); line-height:1.5; }

  .action-row{ display:flex; gap:10px; padding: 16px 16px 6px; }
  .ar-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--card); border:none; border-radius:14px; padding:12px 0;
    font-size:0.74rem; font-weight:700; color:var(--ink);
  }
  .ar-btn .ic{ font-size:1.25rem; }
  .ar-btn.primary{ background:var(--teal); color:#fff; }

  .tabs-row{
    display:flex; gap:22px; padding: 18px 16px 0; border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .tab-btn{
    background:none; border:none; padding-bottom:12px; font-weight:700; font-size:0.9rem;
    color:var(--gray-text); border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--teal); }

  .tab-panel{ display:none; padding: 18px 16px 10px; }
  .tab-panel.active{ display:block; }

  .kbyg-box{
    background:#FFF7E6; border:1px solid #FCE3A8; border-radius:var(--radius-md);
    padding:14px 16px; margin-bottom:18px;
  }
  .kbyg-box .t{ font-weight:800; font-size:0.88rem; margin-bottom:4px; }
  .kbyg-box .d{ font-size:0.88rem; color:var(--gray-text); line-height:1.5; }

  .overview-line{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .overview-line .ic{ width:22px; text-align:center; flex-shrink:0; }
  .overview-line .lbl{ color:var(--gray-text); font-weight:600; min-width:90px; }
  .overview-line .val{ font-weight:700; }

  .menu-grid{ display:flex; flex-direction:column; gap:12px; }
  .menu-card{
    display:flex; gap:12px; align-items:center; background:var(--card); border-radius:var(--radius-md); padding:12px;
  }
  .menu-card .m-thumb{
    width:60px; height:60px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; color:#fff;
  }
  .menu-card .m-info{ flex:1; min-width:0; }
  .menu-card .m-name{ font-weight:800; font-size:0.95rem; }
  .menu-card .m-desc{ font-size:0.8rem; color:var(--gray-text); margin-top:2px; line-height:1.4; }
  .menu-card .m-price{ font-weight:800; font-size:0.88rem; margin-top:6px; color:var(--teal-dark); }
  .add-btn{
    flex-shrink:0; background:var(--teal); color:#fff; border:none; border-radius:999px;
    width:34px; height:34px; font-size:1.1rem; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .add-btn.added{ background:var(--ink); }

  .review-summary{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .review-summary .big{ font-size:2rem; font-weight:800; }
  .review-summary .stars{ color:var(--yellow); font-size:1.1rem; }
  .review-summary .cnt{ color:var(--gray-text); font-weight:600; font-size:0.85rem; }

  .review-card{ padding:14px 0; border-bottom:1px solid var(--border); }
  .review-top{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem; flex-shrink:0;
  }
  .review-top .rname2{ font-weight:800; font-size:0.9rem; }
  .review-top .rdate{ font-size:0.76rem; color:var(--gray-text); }
  .review-stars{ color:var(--yellow); font-size:0.8rem; margin-top:4px; }
  .review-text{ margin-top:8px; font-size:0.88rem; line-height:1.55; color:#333; }
  .review-photo{ margin-top:10px; width:100%; max-width:220px; height:110px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; }

  .see-all-btn{
    width:100%; margin-top:6px; background:var(--card); border:none; border-radius:12px; padding:13px 0;
    font-weight:700; font-size:0.88rem;
  }

  .photos-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .photos-grid .p-item{ aspect-ratio:1/1; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; color:#fff; }

  .update-card{ padding:14px 0; border-bottom:1px solid var(--border); }
  .update-card .u-date{ font-size:0.76rem; color:var(--gray-text); font-weight:700; }
  .update-card .u-text{ margin-top:5px; font-size:0.9rem; line-height:1.5; }

  .bottom-action-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:#fff; border-top:1px solid var(--border);
    padding: 10px 16px max(10px, env(safe-area-inset-bottom));
    display:none; gap:10px;
  }
  .bottom-action-bar .ar-btn{ margin:0; }

  @media (max-width:760px){
    .bottom-action-bar{ display:flex; }
    .action-row{ display:none; }
  }

  /* ================= DESKTOP SPLIT ================= */
  @media (min-width:900px){
    .discovery-body{ flex-direction:row; }
    .list-wrap{ width:400px; flex-shrink:0; order:1; border-right:1px solid var(--border); padding-bottom:20px; }
    .map-wrap{ order:2; flex:1; height:auto; }
    .preview-sheet{ left:auto; right:24px; bottom:24px; width:340px; }
  }

  /* ================= CART MODAL ================= */
  .modal-overlay{ position:fixed; inset:0; background:rgba(15,15,20,0.5); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
  .modal-overlay.hidden{ display:none; }
  .cart-sheet{ background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:78vh; overflow-y:auto; }
  .cart-sheet h3{ font-size:1.1rem; margin-bottom:14px; }
  .cart-line{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .cart-line .cl-name{ flex:1; font-weight:700; font-size:0.9rem; }
  .cart-line .cl-price{ font-weight:700; font-size:0.85rem; color:var(--teal-dark); }
  .qty-ctrl{ display:flex; align-items:center; gap:8px; }
  .qty-ctrl button{ width:26px; height:26px; border-radius:50%; border:none; background:var(--card); font-weight:800; }
  .cart-total-row{ display:flex; justify-content:space-between; padding:16px 0 6px; font-weight:800; font-size:1rem; }
  .checkout-btn{ width:100%; background:var(--teal); color:#fff; border:none; border-radius:14px; padding:14px 0; font-weight:800; margin-top:10px; }
  .empty-cart{ text-align:center; padding:30px 10px; color:var(--gray-text); }
</style>
</head>
<body>
<div id="app">

  <!-- ================= DISCOVERY VIEW ================= -->
  <div class="view active" id="discoveryView">
    <div class="search-bar-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Restaurants">
      </div>
      <button class="cart-btn" id="cartOpenBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="9" cy="21" r="1.4" fill="#fff" stroke="none"/><circle cx="19" cy="21" r="1.4" fill="#fff" stroke="none"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6"/></svg>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </button>
    </div>

    <div class="discovery-body">
      <div class="map-wrap" id="mapWrap">
        <svg viewBox="0 0 400 400" preserveAspectRatio="none" id="mapSvg"></svg>
        <button class="search-area-btn" id="searchAreaBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0Z"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
          Search this area
        </button>
        <div class="map-controls">
          <button class="map-ctrl-btn" id="zoomInBtn">+</button>
          <button class="map-ctrl-btn" id="zoomOutBtn">–</button>
          <button class="map-ctrl-btn" id="locateBtn">◎</button>
        </div>
        <div id="markersLayer"></div>
      </div>

      <div class="list-wrap" id="listWrap">
        <div class="list-heading" id="listHeading">Restaurants near you</div>
        <div id="listContainer"></div>
      </div>
    </div>
  </div>

  <!-- ================= DETAILS VIEW ================= -->
  <div class="view" id="detailsView">
    <div class="details-scroll">
      <div class="details-topbar">
        <button class="icon-btn" id="backBtn">←</button>
        <div class="rname" id="dTopName"></div>
        <div class="spacer"></div>
        <button class="icon-btn save-btn" id="saveBtn">♡</button>
      </div>

      <div class="gallery" id="galleryGrid"></div>

      <div class="details-head">
        <h1 id="dName"></h1>
        <div class="rating-row">
          <span class="stars" id="dStars"></span>
          <span id="dRatingNum"></span>
          <span class="rc" id="dReviewCount"></span>
        </div>
        <div class="cat-status-row">
          <span id="dCategory"></span>
          <span class="dot">·</span>
          <span class="status" id="dStatus"></span>
        </div>
        <div class="addr-line" id="dAddress"></div>
      </div>

      <div class="action-row">
        <button class="ar-btn primary" id="dDirections"><span class="ic">🧭</span>Directions</button>
        <button class="ar-btn" id="dCall"><span class="ic">📞</span>Call</button>
        <button class="ar-btn" id="dShare"><span class="ic">↗</span>Share</button>
        <button class="ar-btn" id="dSave"><span class="ic">♡</span>Save</button>
      </div>

      <div class="tabs-row" id="tabsRow">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="menu">Menu</button>
        <button class="tab-btn" data-tab="reviews">Reviews</button>
        <button class="tab-btn" data-tab="photos">Photos</button>
        <button class="tab-btn" data-tab="updates">Updates</button>
      </div>

      <div class="tab-panel active" data-panel="overview" id="panelOverview"></div>
      <div class="tab-panel" data-panel="menu" id="panelMenu"></div>
      <div class="tab-panel" data-panel="reviews" id="panelReviews"></div>
      <div class="tab-panel" data-panel="photos" id="panelPhotos"></div>
      <div class="tab-panel" data-panel="updates" id="panelUpdates"></div>
    </div>

    <div class="bottom-action-bar">
      <button class="ar-btn primary" id="dDirections2"><span class="ic">🧭</span>Directions</button>
      <button class="ar-btn" id="dCall2"><span class="ic">📞</span>Call</button>
      <button class="ar-btn" id="dShare2"><span class="ic">↗</span>Share</button>
      <button class="ar-btn" id="dSave2"><span class="ic">♡</span>Save</button>
    </div>
  </div>

  <!-- ================= PREVIEW SHEET (marker/list tap) ================= -->
  <div class="preview-sheet" id="previewSheet">
    <div class="preview-top">
      <div>
        <div class="name" id="pvName"></div>
        <div class="preview-meta">
          <span class="stars" id="pvStars"></span>
          <span id="pvRating"></span>
          <span id="pvStatus"></span>
        </div>
      </div>
      <button class="preview-close" id="pvClose">✕</button>
    </div>
    <div class="preview-actions">
      <button class="pa-btn primary" id="pvDirections"><span class="ic">🧭</span>Directions</button>
      <button class="pa-btn" id="pvCall"><span class="ic">📞</span>Call</button>
      <button class="pa-btn" id="pvShare"><span class="ic">↗</span>Share</button>

  // ================= STATE =================
  let currentId = null;

  let mapZoom = 1;
  let previewId = null;

  // ================= PERSISTENCE =================
  async function loadPersisted(){
    try{
      const s = await window.storage.get('foodfinder-saved', false);
      if(s) saved = JSON.parse(s.value);
    }catch(e){}
    try{
      const c = await window.storage.get('foodfinder-cart', false);
      if(c) cart = JSON.parse(c.value);
    }catch(e){}
    renderCartBadge();
  }
  async function persistSaved(){ try{ await window.storage.set('foodfinder-saved', JSON.stringify(saved), false); }catch(e){} }
  async function persistCart(){ try{ await window.storage.set('foodfinder-cart', JSON.stringify(cart), false); }catch(e){} }

  function getR(id){ return RESTAURANTS.find(r=>r.id===id); }

  // ================= TOAST =================
  const toastEl = document.getElementById('toast');
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  function starString(rating){
    if(rating === null || rating === undefined) return '';
    const full = Math.round(rating);
    return '★'.repeat(full) + '☆'.repeat(5-full);
  }

  // ================= STYLIZED MAP ================= 
  function drawMapBackground(){
    const svg = document.getElementById('mapSvg');
    const ns = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';
    const bg = document.createElementNS(ns,'rect');
    bg.setAttribute('width','400'); bg.setAttribute('height','400'); bg.setAttribute('fill','#DCE6E6');
    svg.appendChild(bg);

    // green park blocks
    const parks = [[30,30,60,50],[250,280,90,70],[300,40,70,60]];
    parks.forEach(([x,y,w,h])=>{
      const r = document.createElementNS(ns,'rect');
      r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h);
      r.setAttribute('rx',10); r.setAttribute('fill','#C9E4C5');
      svg.appendChild(r);
    });

    // building blocks
    const blocks = [[110,20,70,40],[200,90,60,50],[40,150,80,50],[150,200,90,60],[260,180,60,40],[60,280,70,50],[180,300,80,50]];
    blocks.forEach(([x,y,w,h])=>{
      const r = document.createElementNS(ns,'rect');
      r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h);
      r.setAttribute('rx',6); r.setAttribute('fill','#EAF0EF'); r.setAttribute('stroke','#CBD8D6'); r.setAttribute('stroke-width','1.5');
      svg.appendChild(r);
    });

    // roads
    const roadsH = [60, 140, 220, 300];
    const roadsV = [80, 160, 240, 320];
    roadsH.forEach(y=>{
      const l = document.createElementNS(ns,'rect');
      l.setAttribute('x','0'); l.setAttribute('y', y-6); l.setAttribute('width','400'); l.setAttribute('height','12'); l.setAttribute('fill','#F5F7F7');
      svg.appendChild(l);
    });
    roadsV.forEach(x=>{
      const l = document.createElementNS(ns,'rect');
      l.setAttribute('x', x-6); l.setAttribute('y','0'); l.setAttribute('width','12'); l.setAttribute('height','400'); l.setAttribute('fill','#F5F7F7');
      svg.appendChild(l);
    });

    // main avenue
    const av = document.createElementNS(ns,'rect');
    av.setAttribute('x','0'); av.setAttribute('y','188'); av.setAttribute('width','400'); av.setAttribute('height','24'); av.setAttribute('fill','#FFF3D6');
    svg.appendChild(av);
  }

  function renderMarkers(list){
    const layer = document.getElementById('markersLayer');
    layer.innerHTML = '';
    const visibleIds = new Set(list.map(r=>r.id));
    RESTAURANTS.forEach(r=>{
      const m = document.createElement('div');
      m.className = 'marker' + (visibleIds.has(r.id) ? '' : ' hidden') + (r.id===previewId ? ' active' : '');
      m.style.left = r.pos.x + '%';
      m.style.top = r.pos.y + '%';
      const pinClass = r.rating === null ? 'pin no-rating' : 'pin';
      const label = r.rating === null ? '📍' : ('★ ' + r.rating.toFixed(1));
      m.innerHTML = `<div class="${pinClass}">${label}</div>`;
      m.addEventListener('click', ()=> openPreview(r.id));
      layer.appendChild(m);
    });
  }

  document.getElementById('zoomInBtn').addEventListener('click', ()=>{
    mapZoom = Math.min(1.6, mapZoom + 0.15);
    document.getElementById('mapSvg').style.transform = `scale(${mapZoom})`;
  });
  document.getElementById('zoomOutBtn').addEventListener('click', ()=>{
    mapZoom = Math.max(0.8, mapZoom - 0.15);
    document.getElementById('mapSvg').style.transform = `scale(${mapZoom})`;
  });
  document.getElementById('locateBtn').addEventListener('click', ()=>{
    mapZoom = 1;
    document.getElementById('mapSvg').style.transform = 'scale(1)';
    showToast('Centered on your area');
  });
  document.getElementById('searchAreaBtn').addEventListener('click', ()=>{
    showToast('Showing restaurants in this area');
  });

  // ================= LIST + SEARCH =================
  function matchesQuery(r, q){
    if(!q) return true;
    q = q.toLowerCase();
    if(r.name.toLowerCase().includes(q)) return true;
    if(r.category.toLowerCase().includes(q)) return true;
    return r.menu.some(item => item.name.toLowerCase().includes(q));
  }

  function currentFilteredList(){
    const q = document.getElementById('searchInput').value.trim();
    return RESTAURANTS.filter(r => matchesQuery(r,q));
  }

  function renderList(){
    const list = currentFilteredList();
    renderMarkers(list);
    const container = document.getElementById('listContainer');
    const heading = document.getElementById('listHeading');
    container.innerHTML = '';

    if(list.length === 0){
      heading.textContent = 'Restaurants near you';
      container.innerHTML = `<div class="no-results"><div class="emoji">🍽️</div><div class="t">No restaurants found</div><div>Try a different search term.</div></div>`;
      return;
    }
    heading.textContent = list.length + ' restaurant' + (list.length===1?'':'s') + ' near you';

    list.forEach(r=>{
      const card = document.createElement('div');
      card.className = 'r-card';
      const statusDot = r.isOpen ? 'open' : 'closed';
      const ratingHtml = r.rating === null
        ? '<span>No rating yet</span>'
        : `<span class="stars">★</span><span>${r.rating.toFixed(1)}</span><span>(${r.reviewCount})</span>`;
      card.innerHTML = `
        <div class="thumb" style="background:linear-gradient(135deg, ${r.grad[0]}, ${r.grad[1]})">${r.cover}</div>
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="meta">${ratingHtml}<span class="status-dot ${statusDot}"></span><span>${r.isOpen ? 'Open' : 'Closed'}</span></div>
          <div class="addr">${r.category} · ${r.address}</div>
        </div>
      `;
      card.addEventListener('click', ()=> openPreview(r.id));
      container.appendChild(card);
    });
  }

  document.getElementById('searchInput').addEventListener('input', renderList);

  // ================= PREVIEW SHEET =================
  const previewSheet = document.getElementById('previewSheet');
  function openPreview(id){
    previewId = id;
    const r = getR(id);
    document.getElementById('pvName').textContent = r.name;
    document.getElementById('pvStars').textContent = r.rating===null ? '' : '★';
    document.getElementById('pvRating').textContent = r.rating===null ? 'No rating yet' : r.rating.toFixed(1) + ' (' + r.reviewCount + ')';
    document.getElementById('pvStatus').textContent = r.isOpen ? '· Open' : '· Closed';
    updateSaveIcon('pvSave', id);
    previewSheet.classList.add('show');
    renderMarkers(currentFilteredList());
  }
  function closePreview(){
    previewId = null;
    previewSheet.classList.remove('show');
    renderMarkers(currentFilteredList());
  }
  document.getElementById('pvClose').addEventListener('click', closePreview);
  document.getElementById('pvViewDetails').addEventListener('click', ()=>{ if(previewId) openDetails(previewId); });
  document.querySelector('.preview-top .name').parentElement.addEventListener('click', (e)=>{
    if(e.target.id !== 'pvClose' && previewId) openDetails(previewId);
  });

  document.getElementById('pvDirections').addEventListener('click', (e)=>{ e.stopPropagation(); doDirections(previewId); });
  document.getElementById('pvCall').addEventListener('click', (e)=>{ e.stopPropagation(); doCall(previewId); });
  document.getElementById('pvShare').addEventListener('click', (e)=>{ e.stopPropagation(); doShare(previewId); });
  document.getElementById('pvSave').addEventListener('click', (e)=>{ e.stopPropagation(); toggleSave(previewId); updateSaveIcon('pvSave', previewId); });

  // ================= ACTIONS: directions / call / share / save =================
  function doDirections(id){
    const r = getR(id);
    if(!r) return;
    const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.address);
    window.open(url, '_blank', 'noopener');
  }
  function doCall(id){
    const r = getR(id);
    if(!r) return;
    window.location.href = 'tel:' + r.phone.replace(/\s+/g,'');
  }
  function doShare(id){
    const r = getR(id);
    if(!r) return;
    const shareData = { title: r.name, text: r.name + ' — ' + r.category + ' in Addis Ababa', url: window.location.href };
    if(navigator.share){
      navigator.share(shareData).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(r.name + ' — ' + r.address).then(()=> showToast('Copied to clipboard'));
    } else {
      showToast('Sharing is not supported on this browser');
    }
  }
  function toggleSave(id){
    saved[id] = !saved[id];
    if(!saved[id]) delete saved[id];
    persistSaved();
    showToast(saved[id] ? 'Saved' : 'Removed from saved');
  }
  function updateSaveIcon(elId, id){
    const el = document.getElementById(elId);
    if(!el) return;
    const isSaved = !!saved[id];
    const icon = el.querySelector('.ic');
    if(icon) icon.textContent = isSaved ? '❤' : '♡';
    else el.textContent = isSaved ? '❤' : '♡';
    el.classList.toggle('saved', isSaved);
  }

  // ================= DETAILS VIEW =================
  function openDetails(id){
    currentId = id;
    activeTab = 'overview';
    const r = getR(id);

    document.getElementById('dTopName').textContent = r.name;
    document.getElementById('dName').textContent = r.name;
    document.getElementById('dStars').textContent = r.rating===null ? '' : starString(r.rating);
    document.getElementById('dRatingNum').textContent = r.rating===null ? '' : r.rating.toFixed(1);
    document.getElementById('dReviewCount').textContent = r.rating===null ? 'No reviews yet' : r.reviewCount + ' reviews';
    document.getElementById('dCategory').textContent = r.category;
    const statusEl = document.getElementById('dStatus');
    statusEl.textContent = (r.isOpen ? 'Open · ' : 'Closed · ') + r.hoursNote;
    statusEl.className = 'status ' + (r.isOpen ? 'open' : 'closed');
    document.getElementById('dAddress').textContent = r.address + ' · ' + r.phone;

    updateSaveIcon('saveBtn', id);
    updateSaveIcon('dSave', id);
    updateSaveIcon('dSave2', id);

    // gallery
    const gg = document.getElementById('galleryGrid');
    gg.innerHTML = '';
    r.gallery.slice(0,3).forEach((g,i)=>{
      const div = document.createElement('div');
      div.className = 'g-item' + (i===0 ? ' g-main' : '');
      div.style.background = `linear-gradient(150deg, ${g.grad[0]}, ${g.grad[1]})`;
      div.innerHTML = g.emoji + `<span class="cap">${g.cap}</span>`;
      gg.appendChild(div);
    });

    buildOverviewPanel(r);
    buildMenuPanel(r);
    buildReviewsPanel(r);
    buildPhotosPanel(r);
    buildUpdatesPanel(r);

    setActiveTab('overview');
    closePreview();
    document.getElementById('detailsView').classList.add('active');
    document.getElementById('discoveryView').classList.remove('active');
    document.querySelector('.details-scroll').scrollTop = 0;
  }

  function buildOverviewPanel(r){
    const p = document.getElementById('panelOverview');
    p.innerHTML = `
      <div class="kbyg-box">
        <div class="t">Know before you go</div>
        <div class="d">${r.knowBefore}</div>
      </div>
      <div class="overview-line"><div class="ic">📍</div><div class="lbl">Address</div><div class="val">${r.address}</div></div>
      <div class="overview-line"><div class="ic">📞</div><div class="lbl">Phone</div><div class="val">${r.phone}</div></div>
      <div class="overview-line"><div class="ic">🕒</div><div class="lbl">Hours</div><div class="val">${r.isOpen ? 'Open now · ' : 'Closed · '}${r.hoursNote}</div></div>
      <div class="overview-line"><div class="ic">🍽️</div><div class="lbl">Category</div><div class="val">${r.category}</div></div>
    `;
  }

  function cartKey(rid, itemName){ return rid + '::' + itemName; }

  function buildMenuPanel(r){
    const p = document.getElementById('panelMenu');
    p.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'menu-grid';
    r.menu.forEach(item=>{
      const key = cartKey(r.id, item.name);
      const inCart = !!cart[key];
      const card = document.createElement('div');
      card.className = 'menu-card';
      card.innerHTML = `
        <div class="m-thumb" style="background:linear-gradient(135deg, ${item.grad[0]}, ${item.grad[1]})">${item.emoji}</div>
        <div class="m-info">
          <div class="m-name">${item.name}</div>
          <div class="m-desc">${item.desc}</div>
          <div class="m-price">${item.price} ETB</div>
        </div>
        <button class="add-btn ${inCart?'added':''}" data-key="${key}">${inCart ? '✓' : '+'}</button>
      `;
      grid.appendChild(card);
      card.querySelector('.add-btn').addEventListener('click', ()=>{
        addToCart(r.id, item);
        buildMenuPanel(r);
      });
    });
    p.appendChild(grid);
  }

  function buildReviewsPanel(r){
    const p = document.getElementById('panelReviews');
    if(r.reviews.length === 0){
      p.innerHTML = `<div class="no-results" style="padding:30px 0;"><div class="emoji">📝</div><div class="t">No reviews yet</div><div>Be the first to visit and share your thoughts.</div></div>`;
      return;
    }
    let html = `<div class="review-summary">
      <div class="big">${r.rating.toFixed(1)}</div>
      <div><div class="stars">${starString(r.rating)}</div><div class="cnt">${r.reviewCount} reviews</div></div>
    </div>`;
    r.reviews.forEach(rev=>{
      html += `<div class="review-card">
        <div class="review-top">
          <div class="avatar">${rev.name.charAt(0)}</div>
          <div><div class="rname2">${rev.name}</div><div class="rdate">${rev.date}</div></div>
        </div>
        <div class="review-stars">${starString(rev.rating)}</div>
        <div class="review-text">${rev.text}</div>
        ${rev.photo ? `<div class="review-photo" style="background:linear-gradient(135deg, ${rev.photo.grad[0]}, ${rev.photo.grad[1]})">${rev.photo.emoji}</div>` : ''}
      </div>`;
    });
    html += `<button class="see-all-btn" id="seeAllReviewsBtn">See all ${r.reviewCount} reviews</button>`;
    p.innerHTML = html;
    document.getElementById('seeAllReviewsBtn').addEventListener('click', ()=> showToast('Showing all available reviews'));
  }

  function buildPhotosPanel(r){
    const p = document.getElementById('panelPhotos');
    const extended = r.gallery.concat(r.gallery).slice(0,6);
    let html = '<div class="photos-grid">';
    extended.forEach(g=>{
      html += `<div class="p-item" style="background:linear-gradient(150deg, ${g.grad[0]}, ${g.grad[1]})">${g.emoji}</div>`;
    });
    html += '</div>';
    p.innerHTML = html;
  }

  function buildUpdatesPanel(r){
    const p = document.getElementById('panelUpdates');
    if(r.updates.length === 0){
      p.innerHTML = `<div class="no-results" style="padding:30px 0;"><div class="emoji">📰</div><div class="t">No updates yet</div><div>Check back later for news from this place.</div></div>`;
      return;
    }
    let html = '';
    r.updates.forEach(u=>{
      html += `<div class="update-card"><div class="u-date">${u.date}</div><div class="u-text">${u.text}</div></div>`;
    });
    p.innerHTML = html;
  }

  function setActiveTab(tab){
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel===tab));
  }
  document.getElementById('tabsRow').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab-btn');
    if(btn) setActiveTab(btn.dataset.tab);
  });

  // details action buttons (top action row + bottom bar, mirrored)
  document.getElementById('dDirections').addEventListener('click', ()=> doDirections(currentId));
  document.getElementById('dCall').addEventListener('click', ()=> doCall(currentId));
  document.getElementById('dShare').addEventListener('click', ()=> doShare(currentId));
  document.getElementById('dSave').addEventListener('click', ()=>{ toggleSave(currentId); updateSaveIcon('dSave',currentId); updateSaveIcon('dSave2',currentId); updateSaveIcon('saveBtn',currentId); });
  document.getElementById('dDirections2').addEventListener('click', ()=> doDirections(currentId));
  document.getElementById('dCall2').addEventListener('click', ()=> doCall(currentId));
  document.getElementById('dShare2').addEventListener('click', ()=> doShare(currentId));
  document.getElementById('dSave2').addEventListener('click', ()=>{ toggleSave(currentId); updateSaveIcon('dSave',currentId); updateSaveIcon('dSave2',currentId); updateSaveIcon('saveBtn',currentId); });
  document.getElementById('saveBtn').addEventListener('click', ()=>{ toggleSave(currentId); updateSaveIcon('dSave',currentId); updateSaveIcon('dSave2',currentId); updateSaveIcon('saveBtn',currentId); });

  document.getElementById('backBtn').addEventListener('click', ()=>{
    document.getElementById('detailsView').classList.remove('active');
    document.getElementById('discoveryView').classList.add('active');
    renderList();
  });

  // ================= CART =================
  function addToCart(rid, item){
    const key = cartKey(rid, item.name);
    if(cart[key]){
      cart[key].qty += 1;
    } else {
      cart[key] = { rid, name: item.name, price: item.price, qty: 1 };
    }
    persistCart();
    renderCartBadge();
    showToast(item.name + ' added to order');
  }
  function changeQty(key, delta){
    if(!cart[key]) return;
    cart[key].qty += delta;
    if(cart[key].qty <= 0) delete cart[key];
    persistCart();
    renderCartBadge();
    renderCartModal();
    if(currentId) buildMenuPanel(getR(currentId));
  }
  function renderCartBadge(){
    const totalQty = Object.values(cart).reduce((s,i)=>s+i.qty,0);
    const badge = document.getElementById('cartBadge');
    if(totalQty > 0){ badge.style.display='flex'; badge.textContent = totalQty; }
    else badge.style.display = 'none';
  }
  function renderCartModal(){
    const linesEl = document.getElementById('cartLines');
    const items = Object.entries(cart);
    if(items.length === 0){
      linesEl.innerHTML = '<div class="empty-cart">Your order is empty. Add items from any restaurant menu.</div>';
      document.getElementById('cartTotalRow').style.display = 'none';
      document.getElementById('checkoutBtn').style.display = 'none';
      return;
    }
    let html = '';
    let total = 0;
    items.forEach(([key, item])=>{
      total += item.price * item.qty;
      const rname = getR(item.rid) ? getR(item.rid).name : '';
      html += `<div class="cart-line">
        <div class="cl-name">${item.name}<br><span style="font-weight:500;color:var(--gray-text);font-size:0.75rem;">${rname}</span></div>
        <div class="qty-ctrl"><button data-key="${key}" data-d="-1">–</button><span>${item.qty}</span><button data-key="${key}" data-d="1">+</button></div>
        <div class="cl-price">${item.price * item.qty} ETB</div>
      </div>`;
    });
    linesEl.innerHTML = html;
    document.getElementById('cartTotalRow').style.display = 'flex';
    document.getElementById('cartTotal').textContent = total + ' ETB';
    document.getElementById('checkoutBtn').style.display = 'block';
    linesEl.querySelectorAll('.qty-ctrl button').forEach(btn=>{
      btn.addEventListener('click', ()=> changeQty(btn.dataset.key, Number(btn.dataset.d)));
    });
  }
  document.getElementById('cartOpenBtn').addEventListener('click', ()=>{
    renderCartModal();
    document.getElementById('cartOverlay').classList.remove('hidden');
  });
  document.getElementById('cartCloseBtn').addEventListener('click', ()=> document.getElementById('cartOverlay').classList.add('hidden'));
  document.getElementById('checkoutBtn').addEventListener('click', ()=> showToast("This is a demo — checkout isn't connected yet"));

  // ================= INIT =================
  drawMapBackground();
  loadPersisted().then(renderList);
  renderList();

})();
</script>
</body>
</html>
